[project]
name = "agent-harness-build"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suvanshchawla", email = "suvanshchawla83@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "openai>=3.32.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agent-harness-build = "agent_harness_build:main"
workspace-server = "agent_harness_build.servers.workspace_server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
